version: "3.9"

networks:
  PracticasINDQ:
    driver: bridge

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: sistema_reservacion_clases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres/data:/var/lib/postgresql/data
    networks:
      - PracticasINDQ

  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./database/mongo/data:/data/db
    networks:
      - PracticasINDQ

  # Descomentar cada bloque cuando la app tenga su backend/ y su Dockerfile
